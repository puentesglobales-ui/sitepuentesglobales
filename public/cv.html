<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Armá tu CV | PuentesGlobales</title>
  <link rel="stylesheet" href="fonts.css">
  <style>
    :root { --bg: #F8FAFC; --white: #fff; --brand: #FF6A00; --brand-dark: #c2410c; --brand-light: #fff7ed; --border: #e2e8f0; --text: #0f172a; --muted: #64748b; --ok: #15803d; --ok-bg: #f0fdf4; --warn: #92400e; --warn-bg: #fffbeb; --err: #b91c1c; --err-bg: #fef2f2; --blue-bg: #eff6ff; --blue: #1e40af; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: var(--bg); color: var(--text); line-height: 1.55; padding-bottom: 6rem; }
    nav { display: flex; justify-content: space-between; align-items: center; padding: 0.9rem 5%; background: var(--white); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 20; }
    .logo { font-weight: 800; font-size: 1.15rem; color: var(--text); text-decoration: none; }
    .logo span { color: var(--brand); }
    .guardado { font-size: 0.8rem; color: var(--muted); }
    .guardado.err { color: var(--err); }
    main { max-width: 720px; margin: 0 auto; padding: 1.25rem 1rem; display: grid; gap: 1rem; }
    .pasos { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .pasos button { border: none; background: var(--border); height: 6px; border-radius: 99px; cursor: pointer; padding: 0; }
    .pasos button.hecho { background: #fdba74; }
    .pasos button.actual { background: var(--brand); }
    .paso-label { font-size: 0.78rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    h1 { font-size: 1.55rem; font-weight: 800; line-height: 1.2; }
    .intro { color: var(--muted); }
    .card { background: var(--white); border: 1px solid var(--border); border-radius: 16px; padding: 1.1rem; display: grid; gap: 0.85rem; }
    label.field { display: grid; gap: 0.3rem; font-size: 0.85rem; font-weight: 600; color: #334155; }
    input[type=text], input[type=tel], input[type=email], input[type=url], input[type=month], select, textarea { width: 100%; padding: 0.7rem 0.85rem; border: 1.5px solid var(--border); border-radius: 10px; font-family: inherit; font-size: 0.95rem; background: var(--white); color: var(--text); }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--brand); }
    textarea { min-height: 110px; resize: vertical; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    @media (max-width: 560px) { .grid2 { grid-template-columns: 1fr; } h1 { font-size: 1.3rem; } }
    .chips { display: flex; flex-wrap: wrap; gap: 0.45rem; }
    .chip { border: 1.5px solid var(--border); background: var(--white); border-radius: 99px; padding: 0.45rem 0.85rem; font-family: inherit; font-size: 0.9rem; cursor: pointer; color: var(--text); }
    .chip[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-light); color: var(--brand-dark); font-weight: 700; }
    .chip.quitar::after { content: " ✕"; color: var(--muted); }
    .opciones { display: grid; gap: 0.45rem; }
    .opcion { display: flex; gap: 0.6rem; align-items: center; border: 1.5px solid var(--border); border-radius: 12px; padding: 0.65rem 0.8rem; cursor: pointer; font-size: 0.93rem; background: var(--white); }
    .opcion:has(input:checked) { border-color: var(--brand); background: var(--brand-light); }
    .opcion input { accent-color: var(--brand); }
    .sugerencias { list-style: none; border: 1.5px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--white); }
    .sugerencias li button { width: 100%; text-align: left; border: none; background: none; padding: 0.6rem 0.85rem; font-family: inherit; font-size: 0.93rem; cursor: pointer; display: flex; justify-content: space-between; gap: 0.5rem; }
    .sugerencias li + li { border-top: 1px solid var(--border); }
    .sugerencias li button:hover, .sugerencias li button:focus { background: var(--brand-light); outline: none; }
    .tag { font-size: 0.72rem; font-weight: 700; border-radius: 99px; padding: 0.1rem 0.5rem; background: var(--warn-bg); color: var(--warn); white-space: nowrap; }
    .consejo { border-radius: 12px; padding: 0.75rem 0.9rem; font-size: 0.9rem; line-height: 1.5; }
    .consejo.importante { background: var(--warn-bg); color: var(--warn); border: 1px solid #fde68a; }
    .consejo.consejo, .consejo.info { background: var(--blue-bg); color: var(--blue); }
    .consejo.error { background: var(--err-bg); color: var(--err); }
    .consejo.aviso { background: var(--warn-bg); color: var(--warn); }
    .consejo.ok { background: var(--ok-bg); color: var(--ok); }
    .item { border: 1px solid var(--border); border-radius: 12px; padding: 0.75rem 0.85rem; display: flex; justify-content: space-between; gap: 0.75rem; align-items: flex-start; }
    .item .meta { font-size: 0.85rem; color: var(--muted); }
    .item .acciones { display: flex; gap: 0.4rem; flex-shrink: 0; }
    .btn { border: none; background: var(--brand); color: white; font-weight: 800; font-family: inherit; font-size: 0.95rem; padding: 0.75rem 1.1rem; border-radius: 12px; cursor: pointer; }
    .btn:hover { background: var(--brand-dark); }
    .btn:disabled { opacity: 0.45; cursor: default; }
    .btn.ghost { background: var(--white); color: var(--text); border: 1.5px solid var(--border); }
    .btn.small { padding: 0.4rem 0.7rem; font-size: 0.82rem; font-weight: 700; }
    .barra { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255,255,255,0.97); border-top: 1px solid var(--border); padding: 0.75rem 1rem; z-index: 20; }
    .barra-in { max-width: 720px; margin: 0 auto; display: flex; justify-content: space-between; gap: 0.75rem; }
    .contador { font-size: 0.78rem; color: var(--muted); text-align: right; }
    .puntaje { display: flex; align-items: center; gap: 1rem; }
    .puntaje .n { font-size: 2.4rem; font-weight: 800; line-height: 1; }
    .barra-p { flex: 1; height: 10px; background: var(--border); border-radius: 99px; overflow: hidden; }
    .barra-p div { height: 100%; border-radius: 99px; }
    .link { background: none; border: none; color: var(--brand-dark); font-weight: 700; cursor: pointer; font-family: inherit; font-size: 0.85rem; padding: 0; text-decoration: underline; }
    [hidden] { display: none !important; }
  </style>
  <script src="config.js"></script>
  <script src="marca.js"></script>
  <script src="vendor/supabase.js"></script>
  <script src="auth-gate.js"></script>
  <script src="cv-guia.js"></script>
</head>
<body>
<nav>
  <a href="index.html" class="logo">Puentes<span>Globales</span></a>
  <span class="guardado" id="guardado" role="status"></span>
</nav>

<main>
  <div class="pasos" id="pasos" aria-label="Progreso"></div>
  <div>
    <div class="paso-label" id="paso-label"></div>
    <h1 id="titulo"></h1>
    <p class="intro" id="intro"></p>
  </div>
  <div id="contenido" class="card"></div>
  <div id="avisos" style="display:grid; gap:0.5rem;"></div>
</main>

<div class="barra">
  <div class="barra-in">
    <button type="button" class="btn ghost" id="atras">← Atrás</button>
    <button type="button" class="btn" id="siguiente">Siguiente →</button>
  </div>
</div>

<script>
const G = CV_GUIA;
const PASOS = [
  { titulo: '¿A qué puesto te vas a postular?', intro: 'Es la pregunta más importante: todo tu CV se arma alrededor de esta respuesta. Elegí un solo puesto.' },
  { titulo: 'Tus datos y tu situación', intro: 'Lo que una empresa europea necesita saber para contactarte y contratarte.' },
  { titulo: 'Tu experiencia laboral', intro: 'Empezá por la más reciente. Lo que más se parezca al puesto, primero y con más detalle.' },
  { titulo: 'Tu formación', intro: 'El título más alto que tengas y los cursos relacionados con el puesto.' },
  { titulo: 'Tus idiomas', intro: 'Con el nivel real, del A1 al C2. En Europa el idioma pesa tanto como la experiencia.' },
  { titulo: 'Habilidades y licencias', intro: 'Herramientas, técnicas y licencias concretas del puesto.' },
  { titulo: 'Tu resumen y la revisión final', intro: 'Tres o cuatro líneas que presentan tu perfil, y la revisión de todo el CV.' }
];
const EXP_PUESTO = { ninguna: 'Nunca trabajé de esto', menos_1: 'Menos de 1 año', '1_3': 'De 1 a 3 años', '3_5': 'De 3 a 5 años', mas_5: 'Más de 5 años' };
const NIVELES_FORM = { secundario: 'Secundario', terciario: 'Técnico / terciario', universitario: 'Universitario', posgrado: 'Posgrado', curso: 'Curso o certificación' };
const RECONOCIMIENTO = { no_hace_falta: 'No hace falta para este puesto', no_iniciado: 'No lo inicié', en_tramite: 'En trámite', reconocido: 'Reconocido' };
const LICENCIAS = ['B', 'C', 'C+E', 'D', 'CAP'];

let user = null;
let paso = 1;
let puedeGuardar = true;
const contacto = { nombre: '', telefono: '', email: '' };
const perfil = { puesto: '', regulada: null, paises: [], experiencia_puesto: null, situacion: {}, experiencia: [], formacion: [], idiomas: [{ idioma: 'Español', nivel: 'Nativo', certificado: '' }], habilidades: [], licencias: [], resumen: '' };

/* ─── Utilidades ──────────────────────────────────────────────────────── */
function el(tag, attrs = {}, ...hijos) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') n.textContent = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (v === true) n.setAttribute(k, '');
    else if (v !== false && v !== null && v !== undefined) n.setAttribute(k, v);
  }
  for (const h of hijos.flat()) if (h !== null && h !== undefined && h !== false) n.append(h);
  return n;
}
const campo = (etiqueta, control) => el('label', { class: 'field' }, etiqueta, control);
const fechaTxt = m => { if (!m) return '?'; const [a, mm] = m.split('-'); return `${mm}/${a}`; };

/* ─── Guardado automático ─────────────────────────────────────────────── */
let timer = null;
function marcar(texto, error) { const g = document.getElementById('guardado'); g.textContent = texto; g.className = 'guardado' + (error ? ' err' : ''); }
function guardar(ya) {
  if (!puedeGuardar) return;
  clearTimeout(timer);
  marcar('Guardando…');
  timer = setTimeout(async () => {
    const r = G.revisar(perfil, contacto);
    const { regulada, ...resto } = perfil;
    const { error } = await PG_AUTH.client.from('pg_perfiles').upsert({
      user_id: user.id, ...resto, paso, completado: r.errores === 0, updated_at: new Date().toISOString()
    }, { onConflict: 'user_id' });
    marcar(error ? 'No se pudo guardar' : 'Guardado ✓', Boolean(error));
  }, ya ? 0 : 700);
}

async function guardarContacto() {
  const m = user.user_metadata || {};
  if (contacto.nombre === (m.full_name || '') && contacto.telefono === (m.phone || '')) return;
  const { data, error } = await PG_AUTH.client.auth.updateUser({ data: { full_name: contacto.nombre, phone: contacto.telefono } });
  if (!error) { user = data.user; PG_AUTH.syncProfile(); }
}

/* ─── Navegación ──────────────────────────────────────────────────────── */
function puedeAvanzar() {
  if (paso === 1) return perfil.puesto && perfil.paises.length && perfil.experiencia_puesto;
  if (paso === 2) return contacto.nombre.trim() && contacto.telefono.trim();
  return true;
}

function render() {
  document.getElementById('pasos').replaceChildren(...PASOS.map((p, i) => el('button', {
    type: 'button', class: i + 1 === paso ? 'actual' : i + 1 < paso ? 'hecho' : '', 'aria-label': `Paso ${i + 1}: ${p.titulo}`,
    onclick: () => ir(i + 1)
  })));
  document.getElementById('paso-label').textContent = `Paso ${paso} de ${PASOS.length}`;
  document.getElementById('titulo').textContent = PASOS[paso - 1].titulo;
  document.getElementById('intro').textContent = PASOS[paso - 1].intro;
  const cont = document.getElementById('contenido');
  cont.replaceChildren();
  [pasoObjetivo, pasoSituacion, pasoExperiencia, pasoFormacion, pasoIdiomas, pasoHabilidades, pasoRevision][paso - 1](cont);
  pintarAvisos();
  document.getElementById('atras').disabled = paso === 1;
  const sig = document.getElementById('siguiente');
  sig.textContent = paso === PASOS.length ? 'Ver mi CV →' : 'Siguiente →';
  actualizarBoton();
}

function actualizarBoton() { document.getElementById('siguiente').disabled = !puedeAvanzar(); }

function pintarAvisos() {
  const cont = document.getElementById('avisos');
  if (paso === 1 || paso === 7) { cont.replaceChildren(); return; }
  const items = G.revisar(perfil, contacto).items.filter(i => i.paso === paso);
  cont.replaceChildren(...items.map(i => el('div', { class: `consejo ${i.nivel}`, text: (i.nivel === 'error' ? '⚠️ ' : '💡 ') + i.texto })));
}

async function ir(n) {
  if (n > paso && !puedeAvanzar()) return;
  if (paso === 2) await guardarContacto();
  paso = Math.max(1, Math.min(PASOS.length, n));
  guardar(true);
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
document.getElementById('atras').addEventListener('click', () => ir(paso - 1));
document.getElementById('siguiente').addEventListener('click', () => {
  if (paso === PASOS.length) { guardar(true); location.href = `cv-ver.html?formato=${G.formatoPara(perfil.paises)}`; }
  else ir(paso + 1);
});

/* ─── Paso 1: objetivo ────────────────────────────────────────────────── */
function pasoObjetivo(cont) {
  const input = el('input', { type: 'text', id: 'puesto', value: perfil.puesto, autocomplete: 'off', placeholder: 'Ej.: enfermera, chofer de camión, niñera, programador…', 'aria-autocomplete': 'list' });
  const lista = el('ul', { class: 'sugerencias', hidden: true });
  const traduccion = el('div');
  const consejos = el('div', { style: 'display:grid; gap:0.5rem;' });
  let t = null;

  input.addEventListener('input', () => {
    perfil.puesto = input.value.trim();
    perfil.regulada = null;
    guardar(); actualizarBoton(); pintarConsejos();
    clearTimeout(t);
    t = setTimeout(async () => {
      const q = input.value.trim();
      if (q.length < 2) { lista.hidden = true; return; }
      try {
        const { sugerencias } = await (await fetch(`/api/v1/profesiones/sugerir?q=${encodeURIComponent(q)}`)).json();
        lista.replaceChildren(...sugerencias.map(s => el('li', {}, el('button', { type: 'button', onclick: () => elegir(s) },
          el('span', { text: s.titulo }), s.regulada ? el('span', { class: 'tag', text: 'Profesión regulada' }) : null))));
        lista.hidden = !sugerencias.length;
      } catch { lista.hidden = true; }
    }, 300);
  });

  function elegir(s) {
    perfil.puesto = s.titulo; perfil.regulada = s.regulada;
    input.value = s.titulo; lista.hidden = true;
    guardar(); actualizarBoton(); traducir(); pintarConsejos();
  }

  async function traducir() {
    traduccion.replaceChildren();
    if (!perfil.puesto || !perfil.paises.length) return;
    try {
      const d = await (await fetch(`/api/v1/profesiones/traducir?q=${encodeURIComponent(perfil.puesto)}&paises=${perfil.paises.join(',')}`)).json();
      if (!d.encontrada) return;
      if (perfil.regulada === null && d.regulada !== null) { perfil.regulada = d.regulada; pintarConsejos(); }
      const filas = Object.entries(d.nombres).filter(([, n]) => n.length).map(([p, n]) => el('div', {}, el('strong', { text: `${G.DESTINOS[p].nombre}: ` }), n.join(', ')));
      if (filas.length) traduccion.replaceChildren(el('div', { class: 'consejo info' }, el('div', { text: '🔎 Así se llama este puesto en las ofertas de cada país. Usá estos nombres al buscar y en el título de tu CV:', style: 'margin-bottom:0.35rem; font-weight:600' }), ...filas));
    } catch { /* sin traducción: no es grave */ }
  }

  function pintarConsejos() {
    consejos.replaceChildren(...G.consejosObjetivo(perfil).map(c => el('div', { class: `consejo ${c.tipo}`, text: (c.tipo === 'importante' ? '⚠️ ' : '💡 ') + c.texto })));
  }

  const paises = el('div', { class: 'chips' }, Object.entries(G.DESTINOS).map(([cod, d]) => {
    const b = el('button', { type: 'button', class: 'chip', 'aria-pressed': String(perfil.paises.includes(cod)), text: d.nombre });
    b.addEventListener('click', () => {
      const i = perfil.paises.indexOf(cod);
      if (i >= 0) perfil.paises.splice(i, 1);
      else if (perfil.paises.length < 5) perfil.paises.push(cod);
      b.setAttribute('aria-pressed', String(perfil.paises.includes(cod)));
      guardar(); actualizarBoton(); traducir(); pintarConsejos();
    });
    return b;
  }));

  const exp = el('div', { class: 'opciones' }, Object.entries(EXP_PUESTO).map(([k, v]) => {
    const r = el('input', { type: 'radio', name: 'exp', value: k, checked: perfil.experiencia_puesto === k });
    r.addEventListener('change', () => { perfil.experiencia_puesto = k; guardar(); actualizarBoton(); pintarConsejos(); });
    return el('label', { class: 'opcion' }, r, v);
  }));

  cont.append(
    campo('Puesto', input), lista, traduccion,
    el('div', { class: 'field' }, el('span', { text: '¿En qué país o países? (hasta 5, mejor 1 o 2)', style: 'font-size:0.85rem; font-weight:600; color:#334155' }), paises),
    el('div', { class: 'field' }, el('span', { text: '¿Cuánta experiencia tenés en este puesto?', style: 'font-size:0.85rem; font-weight:600; color:#334155' }), exp),
    consejos
  );
  traducir(); pintarConsejos();
  if (!perfil.puesto) input.focus();
}

/* ─── Paso 2: datos y situación ───────────────────────────────────────── */
function pasoSituacion(cont) {
  const s = perfil.situacion;
  const texto = (etq, valor, set, attrs = {}) => {
    const i = el('input', { type: 'text', value: valor || '', ...attrs });
    i.addEventListener('input', () => { set(i.value); guardar(); actualizarBoton(); pintarAvisos(); });
    return campo(etq, i);
  };
  const opciones = (etq, clave, mapa) => {
    const sel = el('select', {}, el('option', { value: '', text: 'Elegí una opción' }), Object.entries(mapa).map(([k, v]) => el('option', { value: k, text: v, selected: s[clave] === k })));
    sel.addEventListener('change', () => { s[clave] = sel.value || undefined; guardar(); });
    return campo(etq, sel);
  };
  cont.append(
    el('div', { class: 'grid2' },
      texto('Nombre completo', contacto.nombre, v => { contacto.nombre = v; }, { autocomplete: 'name', required: true }),
      texto('WhatsApp / teléfono con código de país', contacto.telefono, v => { contacto.telefono = v; }, { type: 'tel', autocomplete: 'tel', placeholder: '+54 9 11 1234 5678' }),
      campo('Email', el('input', { type: 'email', value: contacto.email, disabled: true })),
      texto('LinkedIn (opcional)', s.linkedin, v => { s.linkedin = v; }, { type: 'url', placeholder: 'https://linkedin.com/in/…' }),
      texto('Ciudad donde vivís', s.ciudad, v => { s.ciudad = v; }),
      texto('País donde vivís', s.pais_residencia, v => { s.pais_residencia = v; })
    ),
    el('div', { class: 'grid2' },
      opciones('¿Tenés pasaporte de un país de la UE?', 'pasaporte_ue', { si: 'Sí', tramite: 'En trámite', no: 'No' }),
      opciones('¿Permiso para trabajar en el destino?', 'permiso', { si: 'Sí, ya lo tengo', tramite: 'En trámite', no: 'Todavía no' }),
      opciones('¿Desde cuándo podés empezar?', 'disponibilidad', { inmediata: 'De inmediato', '1_mes': 'En 1 mes', '3_meses': 'En 3 meses', mas: 'En más de 3 meses' }),
      opciones('¿Te mudás por el trabajo?', 'reubicacion', { si: 'Sí', no: 'No, busco remoto' })
    ),
    el('div', { class: 'consejo info', text: '💡 No pongas fecha de nacimiento, estado civil, religión ni número de documento: en Europa no se piden en el CV y en varios países es mejor no incluirlos.' })
  );
}

/* ─── Lista editable (experiencia y formación) ────────────────────────── */
function listaEditable(cont, { lista, resumen, formulario, vacio, nuevoTexto }) {
  const zona = el('div', { style: 'display:grid; gap:0.6rem;' });
  const pintar = (editando = null) => {
    zona.replaceChildren();
    lista.forEach((item, i) => {
      if (editando === i) { zona.append(formulario(item, guardado => { lista[i] = guardado; guardar(); pintarAvisos(); pintar(); }, () => pintar())); return; }
      zona.append(el('div', { class: 'item' }, resumen(item),
        el('div', { class: 'acciones' },
          el('button', { type: 'button', class: 'btn ghost small', text: 'Editar', onclick: () => pintar(i) }),
          el('button', { type: 'button', class: 'btn ghost small', text: 'Borrar', onclick: () => { lista.splice(i, 1); guardar(); pintarAvisos(); pintar(); } }))));
    });
    if (!lista.length && editando === null) zona.append(el('p', { class: 'intro', text: vacio }));
    if (editando === -1) zona.append(formulario({}, nuevo => { lista.push(nuevo); guardar(); pintarAvisos(); pintar(); }, () => pintar()));
    else zona.append(el('button', { type: 'button', class: 'btn ghost', text: nuevoTexto, onclick: () => pintar(-1) }));
  };
  cont.append(zona);
  pintar(lista.length ? null : -1);
}

/* ─── Paso 3: experiencia ─────────────────────────────────────────────── */
function pasoExperiencia(cont) {
  perfil.experiencia.sort((a, b) => (b.actual ? '9999' : b.desde || '').localeCompare(a.actual ? '9999' : a.desde || ''));
  cont.append(el('div', { class: 'consejo info', text: `💡 Para cada trabajo: qué hacías y qué lograste, con números si podés ("Atendí 8 pacientes por turno", "Reduje los tiempos de entrega un 20%"). Destacá lo que sirve para ${perfil.puesto || 'el puesto'}.` }));
  listaEditable(cont, {
    lista: perfil.experiencia,
    vacio: 'Todavía no cargaste trabajos.',
    nuevoTexto: '+ Agregar un trabajo',
    resumen: e => el('div', {}, el('strong', { text: `${e.cargo || 'Sin cargo'} · ${e.empresa || 'Sin empresa'}` }),
      el('div', { class: 'meta', text: `${[e.ciudad, e.pais].filter(Boolean).join(', ')} · ${fechaTxt(e.desde)} – ${e.actual ? 'actualidad' : fechaTxt(e.hasta)}` })),
    formulario: (e, ok, cancelar) => {
      const f = { ...e };
      const inp = (etq, k, attrs = {}) => { const i = el('input', { type: 'text', value: f[k] || '', ...attrs }); i.addEventListener('input', () => { f[k] = i.value; }); return campo(etq, i); };
      const actual = el('input', { type: 'checkbox', checked: Boolean(f.actual) });
      const hasta = el('input', { type: 'month', value: f.hasta || '', disabled: Boolean(f.actual) });
      hasta.addEventListener('input', () => { f.hasta = hasta.value; });
      actual.addEventListener('change', () => { f.actual = actual.checked; hasta.disabled = actual.checked; if (actual.checked) f.hasta = ''; });
      const tareas = el('textarea', { maxlength: '900', placeholder: 'Ej.: Atendí a 8 pacientes por turno en terapia intensiva. Administré medicación endovenosa y coordiné con el equipo médico.' }, f.tareas || '');
      const cuenta = el('div', { class: 'contador', text: `${(f.tareas || '').length}/900` });
      tareas.addEventListener('input', () => { f.tareas = tareas.value; cuenta.textContent = `${tareas.value.length}/900`; });
      const form = el('form', { class: 'card', style: 'border-color: var(--brand)' },
        el('div', { class: 'grid2' }, inp('Cargo', 'cargo', { required: true, maxlength: '100' }), inp('Empresa', 'empresa', { required: true, maxlength: '100' }), inp('Ciudad', 'ciudad', { maxlength: '60' }), inp('País', 'pais', { maxlength: '60' }), inp('Desde', 'desde', { type: 'month', required: true }), campo('Hasta', hasta)),
        el('label', { class: 'opcion' }, actual, 'Trabajo acá actualmente'),
        campo('Qué hacías y qué lograste', tareas), cuenta,
        el('div', { style: 'display:flex; gap:0.5rem' }, el('button', { type: 'submit', class: 'btn small', text: 'Guardar trabajo' }), el('button', { type: 'button', class: 'btn ghost small', text: 'Cancelar', onclick: cancelar })));
      form.addEventListener('submit', ev => { ev.preventDefault(); ok({ ...f, cargo: (f.cargo || '').trim(), empresa: (f.empresa || '').trim() }); });
      return form;
    }
  });
}

/* ─── Paso 4: formación ───────────────────────────────────────────────── */
function pasoFormacion(cont) {
  if (perfil.regulada) cont.append(el('div', { class: 'consejo importante', text: `⚠️ ${perfil.puesto} es una profesión regulada: indicá el estado del reconocimiento de tu título en el país de destino.` }));
  listaEditable(cont, {
    lista: perfil.formacion,
    vacio: 'Todavía no cargaste tu formación.',
    nuevoTexto: '+ Agregar un título o curso',
    resumen: f => el('div', {}, el('strong', { text: f.titulo || 'Sin título' }),
      el('div', { class: 'meta', text: `${f.institucion || ''}${f.pais ? `, ${f.pais}` : ''} · ${NIVELES_FORM[f.nivel] || ''}${f.fin ? ` · ${fechaTxt(f.fin)}` : ''}${f.reconocimiento ? ` · Reconocimiento: ${RECONOCIMIENTO[f.reconocimiento]}` : ''}` })),
    formulario: (x, ok, cancelar) => {
      const f = { ...x };
      const inp = (etq, k, attrs = {}) => { const i = el('input', { type: 'text', value: f[k] || '', ...attrs }); i.addEventListener('input', () => { f[k] = i.value; }); return campo(etq, i); };
      const sel = (etq, k, mapa) => { const s = el('select', {}, el('option', { value: '', text: 'Elegí' }), Object.entries(mapa).map(([a, b]) => el('option', { value: a, text: b, selected: f[k] === a }))); s.addEventListener('change', () => { f[k] = s.value; }); return campo(etq, s); };
      const form = el('form', { class: 'card', style: 'border-color: var(--brand)' },
        el('div', { class: 'grid2' }, sel('Nivel', 'nivel', NIVELES_FORM), inp('Título o curso', 'titulo', { required: true, maxlength: '120' }), inp('Institución', 'institucion', { required: true, maxlength: '120' }), inp('País', 'pais', { maxlength: '60' }), inp('Fecha de finalización', 'fin', { type: 'month' }), sel('Reconocimiento en el país de destino', 'reconocimiento', RECONOCIMIENTO)),
        el('div', { style: 'display:flex; gap:0.5rem' }, el('button', { type: 'submit', class: 'btn small', text: 'Guardar' }), el('button', { type: 'button', class: 'btn ghost small', text: 'Cancelar', onclick: cancelar })));
      form.addEventListener('submit', ev => { ev.preventDefault(); ok(f); });
      return form;
    }
  });
}

/* ─── Paso 5: idiomas ─────────────────────────────────────────────────── */
function pasoIdiomas(cont) {
  const zona = el('div', { style: 'display:grid; gap:0.6rem;' });
  const pintar = () => {
    zona.replaceChildren(...perfil.idiomas.map((x, i) => {
      const idioma = el('select', { 'aria-label': 'Idioma' }, G.IDIOMAS_LISTA.map(n => el('option', { value: n, text: n, selected: x.idioma === n })));
      const nivel = el('select', { 'aria-label': 'Nivel' }, el('option', { value: '', text: 'Nivel' }), G.NIVELES.map(n => el('option', { value: n, text: `${n} · ${G.NIVEL_DESC[n]}`, selected: x.nivel === n })));
      const cert = el('input', { type: 'text', value: x.certificado || '', placeholder: 'Certificado (opcional): Goethe B1, IELTS 6.5…', maxlength: '80' });
      idioma.addEventListener('change', () => { x.idioma = idioma.value; guardar(); pintarAvisos(); });
      nivel.addEventListener('change', () => { x.nivel = nivel.value; guardar(); pintarAvisos(); });
      cert.addEventListener('input', () => { x.certificado = cert.value; guardar(); pintarAvisos(); });
      return el('div', { class: 'item', style: 'display:grid; grid-template-columns: 1fr; gap:0.5rem' },
        el('div', { class: 'grid2' }, idioma, nivel), cert,
        el('button', { type: 'button', class: 'link', text: 'Quitar idioma', onclick: () => { perfil.idiomas.splice(i, 1); guardar(); pintarAvisos(); pintar(); } }));
    }));
  };
  pintar();
  cont.append(
    el('div', { class: 'consejo info' }, '💡 Sé honesto con el nivel: en la entrevista lo comprueban. ¿No sabés tu nivel? ', el('a', { href: 'test-idiomas.html', text: 'Hacé el test de idiomas' }), '.'),
    zona,
    el('button', { type: 'button', class: 'btn ghost', text: '+ Agregar idioma', onclick: () => { perfil.idiomas.push({ idioma: 'Inglés', nivel: '', certificado: '' }); guardar(); pintar(); pintarAvisos(); } })
  );
}

/* ─── Paso 6: habilidades y licencias ─────────────────────────────────── */
function pasoHabilidades(cont) {
  const chips = el('div', { class: 'chips' });
  const pintarChips = () => chips.replaceChildren(...perfil.habilidades.map((h, i) => el('button', { type: 'button', class: 'chip quitar', text: h, 'aria-label': `Quitar ${h}`, onclick: () => { perfil.habilidades.splice(i, 1); guardar(); pintarChips(); pintarAvisos(); } })));
  const entrada = el('input', { type: 'text', placeholder: 'Escribí una habilidad y apretá Enter', maxlength: '50' });
  entrada.addEventListener('keydown', ev => {
    if (ev.key !== 'Enter' && ev.key !== ',') return;
    ev.preventDefault();
    const v = entrada.value.trim().replace(/,$/, '');
    if (v && perfil.habilidades.length < 15 && !perfil.habilidades.includes(v)) { perfil.habilidades.push(v); guardar(); pintarChips(); pintarAvisos(); }
    entrada.value = '';
  });
  pintarChips();
  const licencias = el('div', { class: 'chips' }, LICENCIAS.map(l => {
    const b = el('button', { type: 'button', class: 'chip', 'aria-pressed': String(perfil.licencias.includes(l)), text: l });
    b.addEventListener('click', () => {
      const i = perfil.licencias.indexOf(l);
      if (i >= 0) perfil.licencias.splice(i, 1); else perfil.licencias.push(l);
      b.setAttribute('aria-pressed', String(perfil.licencias.includes(l))); guardar(); pintarAvisos();
    });
    return b;
  }));
  cont.append(
    campo('Habilidades del puesto (4 a 8 concretas)', entrada), chips,
    el('div', { class: 'consejo info', text: '💡 Mejor "Excel avanzado", "Soldadura TIG" o "Monitoreo de pacientes críticos" que "responsable" o "proactivo".' }),
    el('div', { class: 'field' }, el('span', { text: 'Licencias de conducir', style: 'font-size:0.85rem; font-weight:600; color:#334155' }), licencias)
  );
}

/* ─── Paso 7: resumen y revisión ──────────────────────────────────────── */
function pasoRevision(cont) {
  const anios = { ninguna: '', menos_1: 'menos de un año', '1_3': 'entre 1 y 3 años', '3_5': 'entre 3 y 5 años', mas_5: 'más de 5 años' }[perfil.experiencia_puesto] || '';
  const resumen = el('textarea', { maxlength: '600', placeholder: 'Ej.: Enfermera con 6 años de experiencia en terapia intensiva y alemán B2 certificado. Busco trabajar en un hospital en Alemania; el reconocimiento de mi título está en trámite.' }, perfil.resumen || '');
  const cuenta = el('div', { class: 'contador', text: `${(perfil.resumen || '').length}/600` });
  const revision = el('div', { style: 'display:grid; gap:0.5rem;' });
  resumen.addEventListener('input', () => { perfil.resumen = resumen.value; cuenta.textContent = `${resumen.value.length}/600`; guardar(); pintarRevision(); });
  const ejemplo = el('button', { type: 'button', class: 'link', text: 'Empezar con un modelo', onclick: () => {
    const destinos = perfil.paises.map(p => G.DESTINOS[p].nombre).join(' o ');
    resumen.value = `${perfil.puesto ? perfil.puesto.split('/')[0].replace(/^./, c => c.toUpperCase()) : 'Profesional'}${anios ? ` con ${anios} de experiencia` : ''} en [tu especialidad]. [Tu logro o fortaleza principal]. Busco trabajar en ${destinos || '[país]'}${perfil.idiomas.length > 1 ? `; ${perfil.idiomas.filter(i => i.idioma !== 'Español' && i.nivel).map(i => `${i.idioma.toLowerCase()} ${i.nivel}`).join(', ')}` : ''}.`;
    resumen.dispatchEvent(new Event('input'));
    resumen.focus();
  } });

  function pintarRevision() {
    const r = G.revisar(perfil, contacto);
    const color = r.puntaje >= 85 ? 'var(--ok)' : r.puntaje >= 60 ? '#d97706' : 'var(--err)';
    revision.replaceChildren(
      el('div', { class: 'puntaje' }, el('div', { class: 'n', text: String(r.puntaje), style: `color:${color}` }),
        el('div', { style: 'flex:1; display:grid; gap:0.3rem' }, el('div', { class: 'barra-p' }, el('div', { style: `width:${r.puntaje}%; background:${color}` })),
          el('div', { class: 'intro', text: r.errores ? `${r.errores} cosas para corregir y ${r.avisos} sugerencias` : r.avisos ? `Sin errores. ${r.avisos} sugerencias para mejorarlo.` : '¡Tu CV está completo!' }))),
      ...r.items.map(i => el('div', { class: `consejo ${i.nivel}` }, (i.nivel === 'error' ? '⚠️ ' : '💡 ') + i.texto + ' ',
        el('button', { type: 'button', class: 'link', text: `Ir al paso ${i.paso}`, onclick: () => ir(i.paso) })))
    );
  }
  pintarRevision();

  const formatos = el('div', { class: 'chips' }, Object.entries(G.FORMATOS).map(([k, f]) => el('a', { class: 'chip', href: `cv-ver.html?formato=${k}`, text: f.nombre, onclick: () => guardar(true) })));
  cont.append(
    campo('Resumen profesional (3 a 4 líneas)', resumen), cuenta, ejemplo,
    el('h2', { text: 'Revisión de tu CV', style: 'font-size:1.05rem; margin-top:0.5rem' }), revision,
    el('div', { class: 'field' }, el('span', { text: `Formato recomendado para tu destino: ${G.FORMATOS[G.formatoPara(perfil.paises)].nombre}. También podés ver:`, style: 'font-size:0.85rem; font-weight:600; color:#334155' }), formatos)
  );
}

/* ─── Inicio ──────────────────────────────────────────────────────────── */
(async () => {
  user = await PG_AUTH.requireAuth();
  const m = user.user_metadata || {};
  contacto.nombre = m.full_name || m.name || '';
  contacto.telefono = m.phone || '';
  contacto.email = user.email;
  const { data, error } = await PG_AUTH.client.from('pg_perfiles').select('*').eq('user_id', user.id).maybeSingle();
  if (error) {
    puedeGuardar = false;
    marcar('No se puede guardar por ahora', true);
  } else if (data) {
    for (const k of Object.keys(perfil)) if (data[k] !== undefined && data[k] !== null && k !== 'regulada') perfil[k] = data[k];
    paso = Math.min(Math.max(1, data.paso || 1), PASOS.length);
  } else if (m.profession && !perfil.puesto) {
    perfil.puesto = '';
  }
  render();
})();
</script>
</body>
</html>
