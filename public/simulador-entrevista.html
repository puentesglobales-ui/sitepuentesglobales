<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de entrevistas | PuentesGlobales</title>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="practica-ia.css">
  <script src="config.js"></script>
  <script src="vendor/supabase.js"></script>
  <script src="marca.js"></script>
  <script src="auth-gate.js"></script>
  <script src="cv-guia.js"></script>
  <script src="practica-ia.js"></script>
</head>
<body>
<nav>
  <a href="index.html" class="logo" data-marca="nombre">PuentesGlobales</a>
  <a href="index.html">← Volver al inicio</a>
</nav>
<main id="raiz"></main>
<script>
const { el } = PRACTICA;
const G = CV_GUIA;
const IDIOMAS = { en: 'Inglés', de: 'Alemán', es: 'Español', fr: 'Francés', it: 'Italiano', nl: 'Neerlandés', pl: 'Polaco', pt: 'Portugués' };

function formulario(sugerido) {
  const s = sugerido || {};
  const puesto = el('input', { type: 'text', maxlength: '120', placeholder: 'Ej.: enfermera, chofer de camión, programador…', value: s.puesto || '' });
  const pais = el('select', {}, el('option', { value: '', text: 'Elegí un país' }),
    Object.entries(G.DESTINOS).map(([c, d]) => el('option', { value: c, text: d.nombre, selected: (s.paises || [])[0] === c })));
  const idioma = el('select', {}, Object.entries(IDIOMAS).map(([c, n]) => el('option', { value: c, text: n })));
  const tipo = el('select', {}, el('option', { value: 'rrhh', text: 'Recursos humanos (motivación, experiencia)' }), el('option', { value: 'tecnica', text: 'Técnica (conocimientos del puesto)' }));
  const dificultad = el('select', {}, el('option', { value: 'easy', text: 'Fácil' }), el('option', { value: 'medium', text: 'Media', selected: true }), el('option', { value: 'hard', text: 'Difícil' }));
  const elegirIdioma = () => { const d = G.DESTINOS[pais.value]; if (d && IDIOMAS[d.idioma]) idioma.value = d.idioma; };
  pais.addEventListener('change', elegirIdioma);
  elegirIdioma();
  return {
    nodo: el('div', { style: 'display:grid; gap:0.75rem' },
      s.puesto ? el('div', { class: 'aviso info', text: 'Completamos los datos con tu CV. Podés cambiarlos.' }) : '',
      el('label', { class: 'campo' }, '¿A qué puesto te postulás?', puesto),
      el('div', { class: 'grid2' },
        el('label', { class: 'campo' }, 'País de la empresa', pais),
        el('label', { class: 'campo' }, 'Idioma de la entrevista', idioma),
        el('label', { class: 'campo' }, 'Tipo de entrevista', tipo),
        el('label', { class: 'campo' }, 'Dificultad', dificultad))),
    leer() {
      if (puesto.value.trim().length < 2) throw new Error('Indicá el puesto al que te postulás.');
      return { puesto: puesto.value.trim(), pais_destino: pais.value ? G.DESTINOS[pais.value].nombre : null, idioma_entrevista: idioma.value, tipo_entrevista: tipo.value, dificultad: dificultad.value };
    }
  };
}

PRACTICA.iniciar({
  producto: 'simulador',
  raiz: document.getElementById('raiz'),
  titulo: 'Simulador de entrevistas',
  intro: 'Practicá una entrevista real para el puesto y el país que elijas. Al final te damos un puntaje y qué mejorar.',
  proximamente: 'Estamos terminando el simulador de entrevistas con IA. Mientras tanto, armá tu CV para el puesto al que te postulás: cuando el simulador esté listo, lo usamos para que la entrevista sea a tu medida.',
  formulario,
  describir: c => [c.puesto, c.pais_destino, IDIOMAS[c.idioma_entrevista]].filter(Boolean).join(' · ')
});
</script>
</body>
</html>
