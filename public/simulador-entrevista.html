<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de entrevistas | PuentesGlobales</title>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="practica-ia.css">
  <script src="config.js"></script>
  <script src="vendor/supabase.js"></script>
  <script src="marca.js"></script>
  <script src="auth-gate.js"></script>
  <script src="cv-guia.js"></script>
  <script src="practica-ia.js"></script>
</head>
<body>
<nav>
  <a href="index.html" class="logo" data-marca="nombre">PuentesGlobales</a>
  <a href="index.html">← Volver al inicio</a>
</nav>
<main id="raiz"></main>
<script>
const { el } = PRACTICA;
const G = CV_GUIA;

// "entrevista_laboral_general" → "Entrevista laboral general"
const nombreTrack = t => t.replace(/_/g, ' ').replace(/^./, c => c.toUpperCase());

// Alex IO hoy recibe el puesto y el tipo de entrevista (track). El país queda en el historial.
function formulario(sugerido, opciones) {
  const s = sugerido || {};
  const puesto = el('input', { type: 'text', maxlength: '120', placeholder: 'Ej.: enfermera, chofer de camión, programador…', value: s.puesto || '' });
  const pais = el('select', {}, el('option', { value: '', text: 'Elegí un país' }),
    Object.entries(G.DESTINOS).map(([c, d]) => el('option', { value: c, text: d.nombre, selected: (s.paises || [])[0] === c })));
  const track = el('select', {}, opciones.map(o => el('option', { value: o.track, text: `${nombreTrack(o.track)} (${o.rondas} rondas)` })));
  return {
    nodo: el('div', { style: 'display:grid; gap:0.75rem' },
      s.puesto ? el('div', { class: 'aviso info', text: 'Completamos los datos con tu CV. Podés cambiarlos.' }) : '',
      el('label', { class: 'campo' }, '¿A qué puesto te postulás?', puesto),
      el('div', { class: 'grid2' },
        el('label', { class: 'campo' }, 'País de la empresa', pais),
        opciones.length > 1 ? el('label', { class: 'campo' }, 'Tipo de entrevista', track) : ''),
      el('p', { class: 'sub', text: 'Por ahora la entrevista es en español. Pronto se podrá practicar en el idioma del país.' })),
    leer() {
      if (puesto.value.trim().length < 2) throw new Error('Indicá el puesto al que te postulás.');
      return { puesto: puesto.value.trim(), pais_destino: pais.value ? G.DESTINOS[pais.value].nombre : null, track: track.value };
    }
  };
}

PRACTICA.iniciar({
  producto: 'simulador',
  raiz: document.getElementById('raiz'),
  titulo: 'Simulador de entrevistas',
  intro: 'Practicá una entrevista para el puesto al que te postulás. Al final te damos un puntaje y qué mejorar.',
  proximamente: 'Estamos terminando el simulador de entrevistas con IA. Mientras tanto, armá tu CV para el puesto al que te postulás: cuando el simulador esté listo, lo usamos para que la entrevista sea a tu medida.',
  formulario,
  describir: c => [c.puesto, c.pais_destino].filter(Boolean).join(' · '),
  // La entrevista es en español por ahora: se puede escuchar al entrevistador y responder hablando.
  idiomaVoz: () => 'es-ES'
});
</script>
</body>
</html>
