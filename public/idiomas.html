<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aprendizaje de idiomas | PuentesGlobales</title>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="practica-ia.css">
  <script src="config.js"></script>
  <script src="vendor/supabase.js"></script>
  <script src="marca.js"></script>
  <script src="auth-gate.js"></script>
  <script src="practica-ia.js"></script>
</head>
<body>
<nav>
  <a href="index.html" class="logo" data-marca="nombre">PuentesGlobales</a>
  <a href="index.html">← Volver al inicio</a>
</nav>
<main id="raiz"></main>
<script>
const { el } = PRACTICA;
const IDIOMAS = { en: 'Inglés', de: 'Alemán', fr: 'Francés', pt: 'Portugués', it: 'Italiano', nl: 'Neerlandés', pl: 'Polaco' };
const nombreIdioma = c => IDIOMAS[c] || c.toUpperCase();

// Solo los idiomas que Alex IO tiene cargados, con sus niveles.
function formulario(_, opciones) {
  const idioma = el('select', {}, opciones.map(o => el('option', { value: o.idioma, text: nombreIdioma(o.idioma) })));
  const niveles = el('p', { class: 'sub' });
  const mostrarNiveles = () => {
    const o = opciones.find(x => x.idioma === idioma.value);
    niveles.textContent = o && o.niveles.length ? `Niveles disponibles: ${o.niveles[0]} a ${o.niveles[o.niveles.length - 1]} (${o.lecciones} lecciones).` : '';
  };
  idioma.addEventListener('change', mostrarNiveles);
  mostrarNiveles();
  return {
    nodo: el('div', { style: 'display:grid; gap:0.75rem' },
      el('label', { class: 'campo' }, 'Idioma que querés practicar', idioma),
      niveles,
      el('p', { class: 'sub' }, 'Empezás por la primera lección y avanzás a medida que respondés bien. ¿No sabés tu nivel? ', el('a', { href: 'test-idiomas.html', text: 'Hacé el test de idiomas' }), '.')),
    leer: () => ({ idioma_objetivo: idioma.value })
  };
}

PRACTICA.iniciar({
  producto: 'idiomas',
  raiz: document.getElementById('raiz'),
  titulo: 'Aprendizaje de idiomas',
  intro: 'Practicá el idioma del país al que vas, con conversaciones pensadas para el trabajo. Te corregimos en cada respuesta.',
  proximamente: 'Estamos terminando las clases de idiomas con IA. Mientras tanto, hacé el test de idiomas gratis para saber tu nivel.',
  formulario,
  describir: c => nombreIdioma(c.idioma_objetivo || ''),
  // Voz para escuchar y dictar: la variante de Europa de cada idioma.
  idiomaVoz: c => ({ en: 'en-GB', de: 'de-DE', fr: 'fr-FR', pt: 'pt-PT', it: 'it-IT', nl: 'nl-NL', pl: 'pl-PL' })[c.idioma_objetivo] || null
});
</script>
</body>
</html>
