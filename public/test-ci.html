<html lang="es">
<head>

  <link rel="stylesheet" href="fonts.css">
  <style>
    :root {
      --bg: #F8FAFC;
      --white: #ffffff;
      --brand: #FF6A00;
      --brand-dark: #c2410c;
      --brand-light: #fff7ed;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --green: #22c55e;
      --green-light: #f0fdf4;
      --red: #ef4444;
      --red-light: #fef2f2;
      --shadow: 0 10px 40px rgba(0,0,0,0.07);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    nav {
      display: flex; justify-content: space-between; align-items: center;
      padding: 1rem 5%; background: rgba(255,255,255,0.95); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100;
    }
    .nav-logo { font-weight: 800; font-size: 1.3rem; color: var(--text); text-decoration: none; }
    .nav-logo span { color: var(--brand); }
    .nav-back { font-size: 0.9rem; font-weight: 600; color: var(--muted); text-decoration: none; }
    .nav-back:hover { color: var(--text); }

    .app { max-width: 680px; margin: 0 auto; padding: 2rem 1rem 6rem; }
    .screen { animation: fadeIn 0.35s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

    /* WELCOME */
    .card { background: var(--white); border-radius: 28px; padding: 2.5rem 2rem; border: 1px solid var(--border); box-shadow: var(--shadow); }
    .welcome { text-align: center; }
    .badge {
      display: inline-flex; align-items: center; gap: 0.5rem; background: var(--brand-light); color: var(--brand);
      font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
      padding: 0.4rem 1rem; border-radius: 100px; margin-bottom: 1.25rem;
    }
    .welcome h1 { font-size: 2rem; font-weight: 900; line-height: 1.1; margin-bottom: 1rem; letter-spacing: -1px; }
    .welcome h1 span { color: var(--brand); font-style: italic; }
    .welcome p { color: var(--muted); font-size: 1rem; line-height: 1.65; margin-bottom: 1.5rem; }
    .pills { display: flex; gap: 0.6rem; justify-content: center; flex-wrap: wrap; margin-bottom: 1.5rem; }
    .pill { background: var(--bg); border: 1px solid var(--border); border-radius: 100px; padding: 0.45rem 1rem; font-size: 0.85rem; font-weight: 600; color: var(--muted); }
    .rules { text-align: left; background: var(--bg); border: 1px solid var(--border); border-radius: 16px; padding: 1rem 1.25rem; margin-bottom: 2rem; font-size: 0.9rem; line-height: 1.6; color: #334155; }
    .rules li { margin-left: 1.1rem; }
    .btn {
      display: block; width: 100%; background: var(--brand); color: white; font-size: 1.05rem; font-weight: 800;
      padding: 1rem 2rem; border-radius: 16px; border: none; cursor: pointer; font-family: inherit;
      box-shadow: 0 4px 20px rgba(255,106,0,0.3); transition: background 0.2s, transform 0.15s; text-align: center; text-decoration: none;
    }
    .btn:hover { background: var(--brand-dark); transform: translateY(-1px); }
    .btn[disabled] { opacity: 0.4; pointer-events: none; }
    .btn-ghost { background: var(--white); color: var(--text); border: 2px solid var(--border); box-shadow: none; margin-top: 0.75rem; }
    .btn-ghost:hover { background: var(--bg); }

    /* QUESTION */
    .top { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.6rem; }
    .timer { font-variant-numeric: tabular-nums; background: var(--white); border: 1px solid var(--border); padding: 0.25rem 0.7rem; border-radius: 100px; color: var(--text); }
    .timer.low { color: var(--red); border-color: #fecaca; background: var(--red-light); }
    .track { height: 6px; background: var(--border); border-radius: 100px; overflow: hidden; margin-bottom: 1.5rem; }
    .fill { height: 100%; background: linear-gradient(90deg, var(--brand), #fb923c); border-radius: 100px; transition: width 0.4s; }
    .q-card { background: var(--white); border-radius: 24px; padding: 1.75rem 1.5rem; border: 1px solid var(--border); box-shadow: var(--shadow); }
    .q-block { display: inline-block; background: var(--brand-light); color: var(--brand); font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; padding: 0.3rem 0.75rem; border-radius: 100px; margin-bottom: 0.9rem; }
    .q-text { font-size: 1.15rem; font-weight: 800; line-height: 1.45; margin-bottom: 1rem; }
    .figure { display: flex; justify-content: center; background: var(--bg); border: 1px solid var(--border); border-radius: 16px; padding: 1rem; margin-bottom: 1.25rem; }
    .figure svg { max-width: 100%; height: auto; }
    .opts { display: grid; gap: 0.7rem; }
    .opts.visual { grid-template-columns: repeat(3, 1fr); }
    .opt {
      display: flex; align-items: center; gap: 0.85rem; background: var(--bg); border: 2px solid var(--border);
      border-radius: 16px; padding: 0.9rem 1.1rem; cursor: pointer; transition: all 0.15s; user-select: none;
      font-size: 0.97rem; font-weight: 600; text-align: left; font-family: inherit; color: inherit; width: 100%;
    }
    .opts.visual .opt { flex-direction: column; padding: 0.6rem; gap: 0.35rem; }
    .opt:hover { border-color: var(--brand); background: var(--brand-light); }
    .opt.selected { border-color: var(--brand); background: var(--brand-light); color: var(--brand-dark); }
    .letter { min-width: 30px; height: 30px; background: var(--white); border: 2px solid var(--border); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.78rem; font-weight: 800; color: var(--muted); }
    .opt.selected .letter { background: var(--brand); border-color: var(--brand); color: white; }
    .opt svg { width: 100%; max-width: 80px; height: auto; }

    .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255,255,255,0.97); border-top: 1px solid var(--border); padding: 0.9rem 1rem; z-index: 50; }
    .bottom-inner { max-width: 680px; margin: 0 auto; }

    /* RESULTS */
    .hero { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: white; border-radius: 24px; padding: 2.25rem 1.75rem; text-align: center; margin-bottom: 1.25rem; }
    .hero-label { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; opacity: 0.7; }
    .hero-ci { font-size: 5rem; font-weight: 900; line-height: 1; letter-spacing: -3px; margin: 0.35rem 0; color: #fb923c; }
    .hero-cat { display: inline-block; background: rgba(255,255,255,0.12); padding: 0.35rem 1rem; border-radius: 100px; font-weight: 700; margin-bottom: 0.75rem; }
    .hero-sub { font-size: 0.9rem; opacity: 0.8; line-height: 1.5; }
    .bell { margin: 1.25rem auto 0; display: block; max-width: 100%; height: auto; }
    .section-title { font-weight: 800; font-size: 1.1rem; margin: 1.5rem 0 0.75rem; }
    .blocks { display: grid; gap: 0.6rem; }
    .block-row { background: var(--white); border: 1px solid var(--border); border-radius: 14px; padding: 0.85rem 1rem; }
    .block-head { display: flex; justify-content: space-between; font-weight: 700; font-size: 0.92rem; margin-bottom: 0.45rem; }
    .bar { height: 8px; background: var(--border); border-radius: 100px; overflow: hidden; }
    .bar > div { height: 100%; background: var(--brand); border-radius: 100px; }
    .disclaimer { background: #fffbeb; border: 1px solid #fde68a; color: #92400e; border-radius: 14px; padding: 0.9rem 1rem; font-size: 0.85rem; line-height: 1.55; margin-top: 1.25rem; }
    .review { background: var(--white); border: 1px solid var(--border); border-radius: 14px; padding: 1rem 1.1rem; margin-bottom: 0.6rem; }
    .review.ok { border-left: 4px solid var(--green); }
    .review.bad { border-left: 4px solid var(--red); }
    .review-q { font-weight: 700; font-size: 0.92rem; margin-bottom: 0.4rem; }
    .review-a { font-size: 0.86rem; margin-bottom: 0.3rem; display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
    .review-a svg { width: 44px; height: 44px; }
    .review-e { color: var(--muted); font-size: 0.85rem; line-height: 1.5; }

    .share-box, .ia-box { background: var(--white); border: 1px solid var(--border); border-radius: 18px; padding: 1.1rem 1.2rem; margin-bottom: 1rem; display: grid; gap: 0.8rem; }
    .ia-box { border: 2px solid var(--brand); background: var(--brand-light); }
    .box-title { font-weight: 800; font-size: 1.05rem; line-height: 1.35; }
    .box-sub { color: var(--muted); font-size: 0.9rem; line-height: 1.5; }
    .share-head { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
    .share-head img { border-radius: 12px; flex-shrink: 0; background: #0f172a; }
    .share-actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.6rem; }
    .share-actions .btn { margin: 0; padding: 0.8rem 1rem; font-size: 0.95rem; box-shadow: none; }
    .btn-wa { background: #16a34a; }
    .btn-wa:hover { background: #15803d; }
    .btn-sm { margin-top: 0; }
    .ia-check { display: flex; gap: 0.65rem; align-items: flex-start; font-size: 0.88rem; line-height: 1.5; color: #334155; cursor: pointer; }
    .ia-check input { margin-top: 0.2rem; width: 18px; height: 18px; flex-shrink: 0; accent-color: var(--brand); }
    .ia-ok { font-size: 0.92rem; line-height: 1.5; color: #166534; font-weight: 600; }
    .ia-msg { font-size: 0.85rem; color: var(--muted); min-height: 1em; }
    .link-btn { background: none; border: none; color: var(--muted); text-decoration: underline; font-size: 0.85rem; cursor: pointer; padding: 0; justify-self: start; font-family: inherit; }

    @media (max-width: 480px) {
      .card { padding: 2rem 1.25rem; }
      .welcome h1 { font-size: 1.6rem; }
      .q-card { padding: 1.25rem 1rem; }
      .q-text { font-size: 1.02rem; }
      .hero-ci { font-size: 4rem; }
    }

<script>
/* ═══ FIGURAS ═══════════════════════════════════════════════════════════════
   Cada celda de una matriz es un objeto de atributos. La respuesta correcta de
   cada matriz es cell(2, 2): se calcula con la misma regla que dibuja las otras
   8 celdas, así nunca puede quedar desalineada con la figura.               */
const COLORS = { azul: '#2563eb', naranja: '#f97316', verde: '#16a34a' };

function S(shape, color = 'azul', count = 1, fill = 'solid') { return { type: 'shape', shape, color, count, fill }; }
function ARROW(rot) { return { type: 'arrow', rot: ((rot % 360) + 360) % 360 }; }
function LINES(segs) { return { type: 'lines', segs: [...segs].sort() }; }
function key(a) { return JSON.stringify(a, Object.keys(a).sort()); }

const POS = {
  1: [[40, 40]],
  2: [[24, 40], [56, 40]],
  3: [[40, 22], [22, 56], [58, 56]],
  4: [[24, 24], [56, 24], [24, 56], [56, 56]],
  5: [[20, 20], [60, 20], [40, 40], [20, 60], [60, 60]],
  6: [[20, 26], [40, 26], [60, 26], [20, 54], [40, 54], [60, 54]]
};
const SIZE = { 1: 22, 2: 13, 3: 12, 4: 11, 5: 9, 6: 8 };

function shapeEl(shape, cx, cy, s, paint) {
  switch (shape) {
    case 'circulo': return `<circle cx="${cx}" cy="${cy}" r="${s}" ${paint}/>`;
    case 'cuadrado': return `<rect x="${cx - s * 0.85}" y="${cy - s * 0.85}" width="${s * 1.7}" height="${s * 1.7}" ${paint}/>`;
    case 'triangulo': return `<polygon points="${cx},${cy - s} ${cx + s},${cy + s * 0.8} ${cx - s},${cy + s * 0.8}" ${paint}/>`;
    case 'rombo': return `<polygon points="${cx},${cy - s} ${cx + s},${cy} ${cx},${cy + s} ${cx - s},${cy}" ${paint}/>`;
  }
  return '';
}

function paintFor(fill, color) {
  const c = COLORS[color];
  if (fill === 'solid') return `fill="${c}"`;
  if (fill === 'claro') return `fill="${c}" fill-opacity="0.28" stroke="${c}" stroke-width="2"`;
  return `fill="none" stroke="${c}" stroke-width="2.5"`;
}

function cellInner(a) {
  if (a.type === 'arrow') {
    return `<g transform="rotate(${a.rot} 40 40)">
      <line x1="40" y1="64" x2="40" y2="24" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/>
      <polygon points="40,10 53,28 27,28" fill="#0f172a"/></g>`;
  }
  if (a.type === 'lines') {
    const L = { arriba: [14, 14, 66, 14], derecha: [66, 14, 66, 66], abajo: [14, 66, 66, 66], izquierda: [14, 14, 14, 66], diag1: [14, 14, 66, 66], diag2: [66, 14, 14, 66] };
    return `<rect x="14" y="14" width="52" height="52" fill="none" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="3,3"/>` +
      a.segs.map(s => `<line x1="${L[s][0]}" y1="${L[s][1]}" x2="${L[s][2]}" y2="${L[s][3]}" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>`).join('');
  }
  const paint = paintFor(a.fill, a.color);
  return POS[a.count].map(([x, y]) => shapeEl(a.shape, x, y, SIZE[a.count], paint)).join('');
}

function cellSVG(a) {
  return `<svg viewBox="0 0 80 80" width="80" height="80" role="img"><rect x="1" y="1" width="78" height="78" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>${cellInner(a)}</svg>`;
}

function matrixSVG(item) {
  const G = 88, parts = [];
  for (let r = 0; r < 3; r++) {
    for (let c = 0; c < 3; c++) {
      const x = c * G, y = r * G;
      if (r === 2 && c === 2) {
        parts.push(`<g transform="translate(${x},${y})"><rect x="1" y="1" width="78" height="78" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6,4"/>
          <text x="40" y="52" text-anchor="middle" font-size="34" font-weight="800" fill="#94a3b8" font-family="sans-serif">?</text></g>`);
      } else {
        parts.push(`<g transform="translate(${x},${y})"><rect x="1" y="1" width="78" height="78" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>${cellInner(item.cell(r, c))}</g>`);
      }
    }
  }
  return `<svg viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Matriz de 3 por 3 con la última celda vacía">${parts.join('')}</svg>`;
}

/* ═══ PREGUNTAS ═════════════════════════════════════════════════════════════ */
const XOR_ROWS = [
  [['arriba', 'izquierda'], ['izquierda', 'diag1']],
  [['derecha', 'abajo', 'diag2'], ['abajo']],
  [['arriba', 'derecha', 'diag1'], ['derecha', 'izquierda', 'diag1']]
];
function xor(a, b) { return [...a.filter(x => !b.includes(x)), ...b.filter(x => !a.includes(x))]; }

const MATRICES = [
  {
    cell: (r, c) => S(['circulo', 'cuadrado', 'triangulo'][c], ['azul', 'naranja', 'verde'][r]),
    distractores: [S('triangulo', 'azul'), S('cuadrado', 'verde'), S('circulo', 'verde'), S('triangulo', 'naranja'), S('triangulo', 'verde', 1, 'vacio')],
    explicacion: 'Cada columna tiene una forma (círculo, cuadrado, triángulo) y cada fila un color. Falta el triángulo verde.'
  },
  {
    cell: (r, c) => S(['circulo', 'cuadrado', 'rombo'][r], 'azul', c + 1),
    distractores: [S('rombo', 'azul', 2), S('rombo', 'azul', 4), S('cuadrado', 'azul', 3), S('circulo', 'azul', 3), S('rombo', 'azul', 3, 'vacio')],
    explicacion: 'La cantidad crece de 1 a 3 en cada fila y la forma es fija por fila. Faltan 3 rombos.'
  },
  {
    cell: (r, c) => ARROW((r * 3 + c) * 45),
    distractores: [ARROW(315), ARROW(270), ARROW(45), ARROW(180), ARROW(90)],
    explicacion: 'La flecha gira 45° en sentido horario en cada celda (leyendo de izquierda a derecha y de arriba abajo). Después de 315° vuelve a apuntar arriba.'
  },
  {
    cell: (r, c) => S(['circulo', 'cuadrado', 'triangulo'][(r + c) % 3], 'naranja', 1, ['solid', 'claro', 'vacio'][c]),
    distractores: [S('cuadrado', 'naranja', 1, 'solid'), S('cuadrado', 'naranja', 1, 'claro'), S('circulo', 'naranja', 1, 'vacio'), S('triangulo', 'naranja', 1, 'vacio'), S('cuadrado', 'azul', 1, 'vacio')],
    explicacion: 'Cada forma aparece una vez por fila y por columna (se desplaza en diagonal), y el relleno depende de la columna: lleno, claro, vacío. Falta el cuadrado vacío.'
  },
  {
    cell: (r, c) => S('circulo', ['azul', 'naranja'][(r + c) % 2], r + c + 1),
    distractores: [S('circulo', 'naranja', 5), S('circulo', 'azul', 4), S('circulo', 'azul', 6), S('circulo', 'naranja', 3), S('cuadrado', 'azul', 5)],
    explicacion: 'La cantidad es fila + columna + 1 (sube de a uno en cada dirección) y el color alterna azul/naranja como un tablero. Faltan 5 círculos azules.'
  },
  {
    cell: (r, c) => S(['circulo', 'triangulo', 'cuadrado'][(r + 2 * c) % 3], ['azul', 'naranja', 'verde'][(r + c) % 3]),
    distractores: [S('circulo', 'azul'), S('circulo', 'verde'), S('triangulo', 'naranja'), S('cuadrado', 'naranja'), S('circulo', 'naranja', 1, 'vacio')],
    explicacion: 'Forma y color siguen dos cuadrados latinos distintos: cada forma y cada color aparecen una sola vez por fila y por columna. Falta el círculo naranja.'
  },
  {
    cell: (r, c) => {
      const base = [[1, 1], [2, 1], [1, 3]][r];
      return S(['cuadrado', 'circulo', 'triangulo'][r], 'verde', c < 2 ? base[c] : base[0] + base[1]);
    },
    distractores: [S('triangulo', 'verde', 3), S('triangulo', 'verde', 5), S('triangulo', 'verde', 2), S('circulo', 'verde', 4), S('cuadrado', 'verde', 4)],
    explicacion: 'En cada fila, la tercera celda tiene la suma de las dos primeras: 1+1=2, 2+1=3, 1+3=4. Faltan 4 triángulos.'
  },
  {
    cell: (r, c) => LINES(c < 2 ? XOR_ROWS[r][c] : xor(XOR_ROWS[r][0], XOR_ROWS[r][1])),
    distractores: [LINES(['arriba', 'derecha', 'izquierda', 'diag1']), LINES(['derecha', 'diag1']), LINES(['arriba', 'izquierda', 'diag1']), LINES(['arriba']), LINES(['izquierda', 'abajo'])],
    explicacion: 'La tercera celda de cada fila muestra solo las líneas que aparecen en UNA de las dos primeras celdas; las que se repiten en ambas desaparecen.'
  }
].map((m, i) => ({ id: i + 1, bloque: 'Matrices', tipo: 'matriz', enunciado: '¿Qué figura completa la matriz?', ...m }));

const TEXTO = [
  // Series
  { bloque: 'Series', enunciado: '¿Qué número continúa?  3, 7, 11, 15, ?', opciones: ['17', '18', '19', '21'], correcta: '19', explicacion: 'Suma 4 en cada paso: 15 + 4 = 19.' },
  { bloque: 'Series', enunciado: '¿Qué número continúa?  1, 3, 6, 10, 15, ?', opciones: ['20', '21', '22', '25'], correcta: '21', explicacion: 'Los saltos son +2, +3, +4, +5, así que sigue +6: 15 + 6 = 21.' },
  { bloque: 'Series', enunciado: '¿Qué número continúa?  81, 27, 9, 3, ?', opciones: ['0', '1', '2', '1/3'], correcta: '1', explicacion: 'Cada número se divide por 3: 3 ÷ 3 = 1.' },
  { bloque: 'Series', enunciado: '¿Qué letra continúa?  A, C, F, J, ?', opciones: ['M', 'N', 'O', 'P'], correcta: 'O', explicacion: 'Se avanza 2, 3, 4 y luego 5 letras: J + 5 = O.' },
  { bloque: 'Series', enunciado: '¿Qué número continúa?  4, 9, 7, 12, 10, ?', opciones: ['8', '13', '15', '17'], correcta: '15', explicacion: 'Se alternan +5 y −2: 10 + 5 = 15.' },
  { bloque: 'Series', enunciado: '¿Qué número continúa?  2, 5, 11, 23, 47, ?', opciones: ['71', '94', '95', '96'], correcta: '95', explicacion: 'Cada número es el doble del anterior más 1: 47 × 2 + 1 = 95.' },
  // Verbal
  { bloque: 'Verbal', enunciado: 'Libro es a leer como tenedor es a…', opciones: ['comer', 'cocinar', 'cuchara', 'plato'], correcta: 'comer', explicacion: 'Relación objeto → acción para la que sirve.' },
  { bloque: 'Verbal', enunciado: 'Frío es a calor como escaso es a…', opciones: ['poco', 'abundante', 'raro', 'lleno'], correcta: 'abundante', explicacion: 'Relación de antónimos.' },
  { bloque: 'Verbal', enunciado: '¿Cuál NO pertenece al grupo?', opciones: ['Cobre', 'Hierro', 'Madera', 'Plata'], correcta: 'Madera', explicacion: 'Cobre, hierro y plata son metales; la madera no.' },
  { bloque: 'Verbal', enunciado: 'Arquitecto es a edificio como compositor es a…', opciones: ['piano', 'sinfonía', 'músico', 'orquesta'], correcta: 'sinfonía', explicacion: 'Relación autor → obra que crea.' },
  { bloque: 'Verbal', enunciado: '¿Cuál es el sinónimo de "efímero"?', opciones: ['eterno', 'pasajero', 'pequeño', 'veloz'], correcta: 'pasajero', explicacion: '"Efímero" significa que dura poco tiempo: pasajero.' },
  // Lógica
  { bloque: 'Lógica', enunciado: 'Si hoy es miércoles, ¿qué día será dentro de 10 días?', opciones: ['Viernes', 'Sábado', 'Domingo', 'Lunes'], correcta: 'Sábado', explicacion: 'En 7 días vuelve a ser miércoles; 3 días más es sábado.' },
  { bloque: 'Lógica', enunciado: 'Ninguna persona que llega tarde recibe el bono. Pedro recibió el bono. ¿Qué se concluye?', opciones: ['Pedro no llegó tarde', 'Pedro llegó tarde', 'Pedro es el mejor empleado', 'No se puede concluir nada'], correcta: 'Pedro no llegó tarde', explicacion: 'Si hubiera llegado tarde no tendría bono; como lo tiene, no llegó tarde.' },
  { bloque: 'Lógica', enunciado: 'Un padre tiene 36 años y su hijo 12. ¿Dentro de cuántos años el padre tendrá el doble de la edad del hijo?', opciones: ['6', '10', '12', '24'], correcta: '12', explicacion: '36 + x = 2 × (12 + x) → x = 12. Tendrán 48 y 24 años.' },
  { bloque: 'Lógica', enunciado: 'Si 3 gatos cazan 3 ratones en 3 minutos, ¿cuántos gatos hacen falta para cazar 100 ratones en 100 minutos?', opciones: ['3', '33', '100', '300'], correcta: '3', explicacion: 'Cada gato caza 1 ratón cada 3 minutos. En 100 minutos, 3 gatos cazan ~100 ratones.' },
  { bloque: 'Lógica', enunciado: 'Un bate y una pelota cuestan 1,10 € en total. El bate cuesta 1 € más que la pelota. ¿Cuánto cuesta la pelota?', opciones: ['0,10 €', '0,05 €', '0,01 €', '1,00 €'], correcta: '0,05 €', explicacion: 'Pelota = x, bate = x + 1 → 2x + 1 = 1,10 → x = 0,05 €. (0,10 € es la respuesta intuitiva pero incorrecta.)' }
].map((q, i) => ({ id: MATRICES.length + i + 1, tipo: 'texto', ...q }));

const PREGUNTAS = [...MATRICES, ...TEXTO];
const BLOQUES = ['Matrices', 'Series', 'Verbal', 'Lógica'];
const TIEMPO_TOTAL = 20 * 60;

/* ═══ PUNTAJE ═══════════════════════════════════════════════════════════════
   Norma PROVISORIA (media 14 / 24, desvío 4,5) hasta tener datos reales.
   Con los resultados que se guardan en Supabase (tabla pg_resultados_test,
   test = 'ci') se puede recalcular la media y el desvío de la población real.  */
const NORMA = { media: 14, desvio: 4.5 };

function estimarCI(aciertos) {
  const z = (aciertos - NORMA.media) / NORMA.desvio;
  return Math.max(55, Math.min(145, Math.round(100 + 15 * z)));
}

function categoriaCI(ci) {
  if (ci >= 130) return 'Muy superior';
  if (ci >= 120) return 'Superior';
  if (ci >= 110) return 'Promedio alto';
  if (ci >= 90) return 'Promedio';
  if (ci >= 80) return 'Promedio bajo';
  return 'Por debajo del promedio';
}

/* ═══ ESTADO ════════════════════════════════════════════════════════════════ */
let state = null;
let timerId = null;
const LETTERS = ['A', 'B', 'C', 'D', 'E', 'F'];
const app = document.getElementById('app');
const bar = document.getElementById('bottom-bar');
const btnNext = document.getElementById('btn-next');

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function correctKey(q) { return q.tipo === 'matriz' ? key(q.cell(2, 2)) : q.correcta; }

function buildOptions(q) {
  if (q.tipo === 'matriz') return shuffle([q.cell(2, 2), ...q.distractores]).map(a => ({ key: key(a), attrs: a }));
  return shuffle(q.opciones).map(t => ({ key: t, text: t }));
}

function renderWelcome() {
  bar.style.display = 'none';
  app.innerHTML = `
    <div class="card welcome screen">
      <div class="badge">💡 Test 6 de 6 · Coeficiente Intelectual</div>
      <h1>¿Cuál es tu <span>CI estimado?</span></h1>
      <p>24 preguntas de matrices, series, analogías verbales y lógica, con tiempo límite. El mismo tipo de ejercicios que usan los tests de inteligencia general.</p>
      <div class="pills"><div class="pill">🕐 20 minutos</div><div class="pill">📊 24 preguntas</div><div class="pill">🧩 4 bloques</div></div>
      <ul class="rules">
        <li>El reloj corre desde que empezás; al llegar a 0 el test termina solo.</li>
        <li>Las preguntas sin responder cuentan como incorrectas.</li>
        <li>Hacelo en un lugar tranquilo y sin calculadora.</li>
      </ul>
      <button class="btn" onclick="start()">Empezar test →</button>
    </div>`;
}

function start() {
  state = {
    idx: 0,
    started: Date.now(),
    items: PREGUNTAS.map(q => ({ q, opts: buildOptions(q), chosen: null }))
  };
  bar.style.display = 'block';
  clearInterval(timerId);
  timerId = setInterval(tick, 1000);
  renderQuestion();
  window.scrollTo(0, 0);
}

function remaining() { return Math.max(0, TIEMPO_TOTAL - Math.floor((Date.now() - state.started) / 1000)); }

function fmt(s) { return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; }

function tick() {
  const r = remaining();
  const el = document.getElementById('timer');
  if (el) { el.textContent = '⏱ ' + fmt(r); el.classList.toggle('low', r <= 120); }
  if (r === 0) finish(true);
}

function renderQuestion() {
  const it = state.items[state.idx];
  const q = it.q;
  const total = state.items.length;
  const visual = q.tipo === 'matriz';
  const r = remaining();

  const optsHTML = it.opts.map((o, i) => `
    <button type="button" class="opt ${it.chosen === o.key ? 'selected' : ''}" data-i="${i}">
      <span class="letter">${LETTERS[i]}</span>
      ${visual ? cellSVG(o.attrs) : `<span>${o.text}</span>`}
    </button>`).join('');

  app.innerHTML = `
    <div class="screen">
      <div class="top"><span>Pregunta ${state.idx + 1} de ${total}</span><span class="timer ${r <= 120 ? 'low' : ''}" id="timer">⏱ ${fmt(r)}</span></div>
      <div class="track"><div class="fill" style="width:${(state.idx / total) * 100}%"></div></div>
      <div class="q-card">
        <span class="q-block">${q.bloque}</span>
        <div class="q-text">${q.enunciado}</div>
        ${visual ? `<div class="figure">${matrixSVG(q)}</div>` : ''}
        <div class="opts ${visual ? 'visual' : ''}">${optsHTML}</div>
      </div>
    </div>`;

  app.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
    it.chosen = it.opts[Number(b.dataset.i)].key;
    app.querySelectorAll('.opt').forEach(x => x.classList.toggle('selected', x === b));
    updateBtn();
  }));
  updateBtn();
}

function updateBtn() {
  const it = state.items[state.idx];
  btnNext.disabled = it.chosen === null;
  btnNext.textContent = state.idx < state.items.length - 1 ? 'Continuar →' : 'Ver mi resultado →';
}

function next() {
  if (!state || state.items[state.idx].chosen === null) return;
  if (state.idx < state.items.length - 1) {
    state.idx++;
    renderQuestion();
    window.scrollTo(0, 0);
  } else {
    finish(false);
  }
}

function bellSVG(ci) {
  // Curva normal (media 100, desvío 15) con marca en el CI obtenido.
  const W = 300, H = 90, pts = [];
  for (let x = 55; x <= 145; x += 1) {
    const z = (x - 100) / 15;
    pts.push(`${((x - 55) / 90) * W},${H - 10 - Math.exp(-z * z / 2) * (H - 20)}`);
  }
  const mx = ((ci - 55) / 90) * W;
  return `<svg class="bell" viewBox="0 0 ${W} ${H + 14}" width="${W}" height="${H + 14}" aria-hidden="true">
    <polyline points="${pts.join(' ')}" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="2"/>
    <line x1="${mx}" y1="4" x2="${mx}" y2="${H - 10}" stroke="#fb923c" stroke-width="3"/>
    <circle cx="${mx}" cy="4" r="4" fill="#fb923c"/>
    ${[70, 85, 100, 115, 130].map(v => `<text x="${((v - 55) / 90) * W}" y="${H + 10}" fill="rgba(255,255,255,0.6)" font-size="10" text-anchor="middle" font-family="sans-serif">${v}</text>`).join('')}
  </svg>`;
}

function finish(porTiempo) {
  if (!state || state.done) return;
  state.done = true;
  clearInterval(timerId);
  bar.style.display = 'none';

  const seg = Math.min(TIEMPO_TOTAL, Math.round((Date.now() - state.started) / 1000));
  const results = state.items.map(it => ({ ...it, ok: it.chosen === correctKey(it.q) }));
  const aciertos = results.filter(r => r.ok).length;
  const ci = estimarCI(aciertos);
  const cat = categoriaCI(ci);
  const porBloque = BLOQUES.map(b => {
    const rs = results.filter(r => r.q.bloque === b);
    return { bloque: b, ok: rs.filter(r => r.ok).length, total: rs.length };
  });

  PG_AUTH.saveResult('ci', aciertos, results.length, {
    ci_estimado: ci, categoria: cat, segundos: seg, por_tiempo: porTiempo,
    por_bloque: porBloque, respuestas: results.map(r => ({ id: r.q.id, ok: r.ok }))
  });

  const review = results.map((r, i) => {
    const q = r.q;
    let tu = '—', corr = '';
    if (q.tipo === 'matriz') {
      const chosen = r.opts.find(o => o.key === r.chosen);
      tu = chosen ? cellSVG(chosen.attrs) : 'sin responder';
      corr = cellSVG(q.cell(2, 2));
    } else {
      tu = r.chosen === null ? 'sin responder' : `<strong>${r.chosen}</strong>`;
      corr = `<strong>${q.correcta}</strong>`;
    }
    return `
      <div class="review ${r.ok ? 'ok' : 'bad'}">
        <div class="review-q">${i + 1}. [${q.bloque}] ${q.enunciado} ${r.ok ? '✅' : '❌'}</div>
        ${r.ok ? '' : `<div class="review-a">Tu respuesta: ${tu} · Correcta: ${corr}</div>`}
        <div class="review-e">💡 ${q.explicacion}</div>
      </div>`;
  }).join('');

  app.innerHTML = `
    <div class="screen">
      <div class="hero">
        <div class="hero-label">CI estimado</div>
        <div class="hero-ci">${ci}</div>
        <div class="hero-cat">${cat}</div>
        <div class="hero-sub">${aciertos} de ${results.length} respuestas correctas · ${fmt(seg)} min${porTiempo ? ' · se terminó el tiempo' : ''}<br>Rango probable: ${Math.max(55, ci - 8)}–${Math.min(145, ci + 8)}</div>
        ${bellSVG(ci)}
      </div>

      <div class="share-box">
        <div class="share-head">
          <div>
            <div class="box-title">Compartí tu resultado</div>
            <div class="box-sub">Desafiá a tus amigos a superar tu CI.</div>
          </div>
          <img id="share-preview" alt="Tarjeta con tu CI estimado" width="96" height="96">
        </div>
        <div class="share-actions">
          <button type="button" class="btn btn-share" id="btn-share">Compartir</button>
          <a class="btn btn-wa" id="btn-wa" target="_blank" rel="noopener">WhatsApp</a>
          <button type="button" class="btn btn-ghost btn-sm" id="btn-download">Descargar imagen</button>
        </div>
      </div>

      <div class="ia-box" id="ia-box">
        <div class="box-title">¿Te interesan trabajos remotos entrenando inteligencia artificial?</div>
        <p class="box-sub">Las empresas de IA buscan personas que revisen y corrijan respuestas de IA en español y otros idiomas. Es trabajo remoto, con horarios flexibles y pago según cada proyecto.</p>
        <div id="ia-body"><p class="box-sub">Cargando…</p></div>
      </div>

      <div class="section-title">Resultado por bloque</div>
      <div class="blocks">
        ${porBloque.map(b => `
          <div class="block-row">
            <div class="block-head"><span>${b.bloque}</span><span>${b.ok}/${b.total}</span></div>
            <div class="bar"><div style="width:${Math.round((b.ok / b.total) * 100)}%"></div></div>
          </div>`).join('')}
      </div>

      <div class="disclaimer">⚠️ <strong>Estimación orientativa.</strong> Este test no está estandarizado clínicamente: el CI se calcula con una norma provisoria y tiene un margen de error amplio. No reemplaza una evaluación profesional (por ejemplo WAIS o Raven administrados por un psicólogo). Usalo como práctica para los tests de aptitud de los procesos de selección.</div>

      <div class="section-title">Revisión pregunta por pregunta</div>
      ${review}

      <button class="btn" onclick="start()">🔄 Volver a hacer el test</button>
      <a href="index.html" class="btn btn-ghost">← Volver al inicio</a>
    </div>`;
  window.scrollTo(0, 0);
  initShare(ci, cat);
  initTrabajosIA();
}

/* ═══ COMPARTIR ═════════════════════════════════════════════════════════════ */
const TEST_URL = `${location.origin}/test-ci.html`;

async function shareCard(ci, cat) {
  try { await document.fonts.ready; } catch (e) { /* sin fuentes: usa las del sistema */ }
  const S = 1080, c = document.createElement('canvas');
  c.width = S; c.height = S;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, S, S);
  g.addColorStop(0, '#0f172a'); g.addColorStop(1, '#1e293b');
  x.fillStyle = g; x.fillRect(0, 0, S, S);
  x.textAlign = 'center';
  const font = (w, px) => `${w} ${px}px 'Plus Jakarta Sans', system-ui, sans-serif`;
  x.fillStyle = '#ffffff'; x.font = font(800, 54); x.fillText('Puentes', S / 2 - 120, 140);
  x.fillStyle = '#FF6A00'; x.fillText('Globales', S / 2 + 115, 140);
  x.fillStyle = 'rgba(255,255,255,0.7)'; x.font = font(700, 40); x.fillText('MI CI ESTIMADO', S / 2, 330);
  x.fillStyle = '#fb923c'; x.font = font(900, 300); x.fillText(String(ci), S / 2, 610);
  x.fillStyle = 'rgba(255,255,255,0.14)';
  x.font = font(700, 50);
  const pillW = Math.min(S - 160, x.measureText(cat).width + 90);
  x.beginPath();
  if (x.roundRect) x.roundRect((S - pillW) / 2, 670, pillW, 90, 45); else x.rect((S - pillW) / 2, 670, pillW, 90);
  x.fill();
  x.fillStyle = '#ffffff'; x.fillText(cat, S / 2, 732);
  x.font = font(800, 58); x.fillText('¿Cuánto sacás vos?', S / 2, 880);
  x.fillStyle = 'rgba(255,255,255,0.6)'; x.font = font(600, 34);
  x.fillText(TEST_URL.replace(/^https?:\/\//, ''), S / 2, 960);
  return c;
}

async function initShare(ci, cat) {
  const text = `Saqué ${ci} en el test de CI gratis de Puentes Globales (${cat}). ¿Cuánto sacás vos?`;
  const wa = document.getElementById('btn-wa');
  wa.href = `https://wa.me/?text=${encodeURIComponent(`${text} ${TEST_URL}`)}`;

  const canvas = await shareCard(ci, cat);
  document.getElementById('share-preview').src = canvas.toDataURL('image/png');
  const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
  const file = new File([blob], `mi-ci-${ci}.png`, { type: 'image/png' });

  document.getElementById('btn-download').addEventListener('click', () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = file.name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });

  document.getElementById('btn-share').addEventListener('click', async () => {
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], text, url: TEST_URL });
      } else if (navigator.share) {
        await navigator.share({ text, url: TEST_URL });
      } else {
        await navigator.clipboard.writeText(`${text} ${TEST_URL}`);
        document.getElementById('btn-share').textContent = 'Texto copiado ✓';
      }
    } catch (e) { /* la persona canceló el menú de compartir */ }
  });
}

/* ═══ TRABAJOS DE IA (permiso con historial en pg_consentimientos) ═══════════ */
const PERMISO_IA = {
  tipo: 'trabajos_ia',
  version: 'trabajos_ia_v1',
  texto: 'Quiero que Puentes Globales me escriba con propuestas de trabajo remoto de entrenamiento de inteligencia artificial y use el resultado de este test para evaluarme para esos trabajos. Una persona del equipo revisa siempre la selección. Mi CV no se usa como datos para entrenar IA. Puedo retirar este permiso cuando quiera.'
};

async function guardarPermisoIA(aceptado) {
  const user = await PG_AUTH.getUser();
  if (!user) throw new Error('sin sesión');
  const { error } = await PG_AUTH.client.from('pg_consentimientos').insert({
    user_id: user.id, tipo: PERMISO_IA.tipo, aceptado,
    version: PERMISO_IA.version, texto: PERMISO_IA.texto, origen: 'test-ci'
  });
  if (error) throw error;
}

async function initTrabajosIA() {
  const body = document.getElementById('ia-body');
  let vigente = false;
  try {
    const { data, error } = await PG_AUTH.client.from('pg_consentimientos')
      .select('aceptado').eq('tipo', PERMISO_IA.tipo)
      .order('created_at', { ascending: false }).limit(1);
    if (error) throw error;
    vigente = Boolean(data && data[0] && data[0].aceptado);
  } catch (e) {
    console.warn('No se pudo leer el permiso de trabajos de IA:', e.message || e);
  }
  vigente ? renderIAAnotado(body) : renderIAFormulario(body);
}

function renderIAFormulario(body) {
  body.innerHTML = `
    <label class="ia-check" for="ia-acepto">
      <input type="checkbox" id="ia-acepto">
      <span id="ia-texto"></span>
    </label>
    <button type="button" class="btn" id="ia-enviar" disabled>Anotarme</button>
    <p class="ia-msg" id="ia-msg" role="status"></p>`;
  document.getElementById('ia-texto').textContent = PERMISO_IA.texto;
  const check = document.getElementById('ia-acepto');
  const btn = document.getElementById('ia-enviar');
  check.addEventListener('change', () => { btn.disabled = !check.checked; });
  btn.addEventListener('click', async () => {
    btn.disabled = true;
    btn.textContent = 'Guardando…';
    try {
      await guardarPermisoIA(true);
      renderIAAnotado(body, true);
    } catch (e) {
      document.getElementById('ia-msg').textContent = 'No pudimos guardar tu respuesta. Probá de nuevo en unos minutos.';
      btn.disabled = false;
      btn.textContent = 'Anotarme';
    }
  });
}

function renderIAAnotado(body, recien) {
  body.innerHTML = `
    <p class="ia-ok">${recien ? '¡Listo! Te anotamos.' : 'Ya estás anotado/a.'} Si tu perfil encaja con un proyecto, te vamos a escribir por email para preguntarte si querés participar. No compartimos tus datos con nadie hasta que aceptes.</p>
    <button type="button" class="link-btn" id="ia-retirar">Retirar mi permiso</button>
    <p class="ia-msg" id="ia-msg" role="status"></p>`;
  document.getElementById('ia-retirar').addEventListener('click', async () => {
    try {
      await guardarPermisoIA(false);
      renderIAFormulario(body);
      document.getElementById('ia-msg').textContent = 'Retiramos tu permiso. No te vamos a escribir por estos trabajos.';
    } catch (e) {
      document.getElementById('ia-msg').textContent = 'No pudimos retirar el permiso. Probá de nuevo en unos minutos.';
    }
  });
}

renderWelcome();
